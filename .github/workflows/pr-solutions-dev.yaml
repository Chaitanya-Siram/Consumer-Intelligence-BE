name: PR Solutions V2 Dev
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          docker build -f pr-solutions/Dockerfile -t 958065208983.dkr.ecr.us-west-1.amazonaws.com/pr-solutions-v2:${{ github.run_number }} .
          docker push 958065208983.dkr.ecr.us-west-1.amazonaws.com/pr-solutions-v2:${{ github.run_number }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - uses: richardrigutins/replace-in-files@v1
        with:
          files: "./build/pr-solutions-dev.yaml"
          search-text: '_BUILD__ID_'
          replacement-text: '${{ github.run_number }}'

      - name: Deploy
        uses: safe2008/eks-actions@v0.0.4
        env:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: us-west-1
          cluster_name: AMX-EKS
        with:
          args: |
            kubectl apply -f ./build/pr-solutions-dev.yaml -n pr-solutions-v2
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Send notification to Microsoft Teams
        uses: dchourasia/ms-teams-notification@1.1
        with:
          github-token: ${{ github.token }}
          webhook-uri: ${{ secrets.TEAMS_WEBHOOK_URL }}
          card-layout-exit: compact
          environment: dev
          custom-facts: |
            - name: Changed Files
              value: ${{ github.event.pull_request.changed_files }}
            - name: Pull Request
              value: "https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          custom-actions: |
            - text: View PR
              url: "https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
            - text: View CI
              url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
 
